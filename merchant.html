<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merchant Panel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:380px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

h2{
    text-align:center;
    color:white;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.1);
    color:white;
    outline:none;
    transition:0.3s;
}

input:focus{
    background:rgba(255,255,255,0.2);
    box-shadow:0 0 10px rgba(255,255,255,0.2);
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

.link-box{
    margin-top:15px;
    padding:10px;
    background:rgba(255,255,255,0.1);
    border-radius:10px;
    color:white;
}

#link{
    width:100%;
    padding:8px;
    border:none;
    border-radius:8px;
    margin-top:8px;
}

.copy-btn{
    margin-top:8px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Merchant Panel</h2>

    <input id="name" placeholder="Customer Name">
    <input id="phone" placeholder="Customer Phone Number">
    <input id="amount" placeholder="Amount (₹)">

    <button onclick="generateLink()">Generate Payment Link</button>

    <div class="link-box">
        <p>Payment Link:</p>
        <input id="link" readonly>
        <button class="copy-btn" onclick="copyLink()">Copy Link</button>
    </div>
</div>

<script>
function generateLink(){

    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let amount = document.getElementById("amount").value;

    if(!name || !phone || !amount){
        alert("Please fill all details");
        return;
    }

    let upi = "9341356667@ybl"; // replace with your UPI ID

    let url = `pay.html?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&amount=${amount}&upi=${upi}`;

    let link = location.href.replace("merchant.html","") + url;

    document.getElementById("link").value = link;
}

function copyLink(){
    let link = document.getElementById("link");
    link.select();
    document.execCommand("copy");
    alert("Link copied");
}
</script>

</body>
</html>
